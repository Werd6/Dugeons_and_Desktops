name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Dungeons-and-Desktops-macOS.zip
          - os: windows-latest
            artifact: Dungeons-and-Desktops-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[packaging]"

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/dungeons_desktops.spec --noconfirm

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Dungeons and Desktops.app" "${{ matrix.artifact }}"
          mv "${{ matrix.artifact }}" ..

      - name: Zip Windows onedir
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Dungeons and Desktops\*" -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release zips
        id: meta
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/*/*.zip release/ || cp artifacts/*.zip release/
          ls -la release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Dungeons & Desktops ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Dev builds" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: ${{ steps.meta.outputs.prerelease == 'false' }}
          body: |
            Download the zip for your platform, unpack, and run.

            **macOS (unsigned test build):** right-click the app → Open, or run
            `xattr -cr "Dungeons and Desktops.app"` after unzipping.

            **Windows (unsigned test build):** if SmartScreen warns, choose
            More info → Run anyway.
          files: release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
